# Sinal de vida diário: o plano grátis do Supabase pausa o projeto depois de 7 dias sem uso.
# Uma chamada simples por dia (ação "sair", que não mexe em nada) mantém o projeto ativo nas semanas paradas.
name: Sinal de vida (Supabase)

on:
  schedule:
    - cron: '17 11 * * *'   # todo dia às 08:17 de Brasília
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o Supabase
        run: |
          curl -sf -m 30 -X POST https://cborhjhmaznboxwtckgj.supabase.co/rest/v1/rpc/api \
            -H 'apikey: sb_publishable_dFOxtIbFaC5BUiLmEO0w_w_klQyynxU' -H 'Content-Type: application/json' -d '{"a":"sair"}'
